<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Documents</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --fg: #2f343b;
      --muted: #6b7280;
      --hover: #f1f3f5;
      --folder: #3da5f4;
      --file: #66727f;
      --border: #d9dee3;
      --panel: #f6f8fa;
      --danger: #b42318;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #17191c;
        --fg: #e8eaed;
        --muted: #aeb5bd;
        --hover: #25292e;
        --folder: #5db6f6;
        --file: #aab4bf;
        --border: #343a40;
        --panel: #20242a;
        --danger: #ff8a80;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 18px;
      line-height: 1.45;
    }
    main {
      max-width: 1500px;
      margin: 0 auto;
      padding: 18px 22px 50px;
    }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    h1 {
      margin: 0 auto 0 0;
      font-size: 1.35rem;
      font-weight: 650;
    }
    button, input { font: inherit; }
    button {
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--fg);
      border-radius: 7px;
      padding: 7px 11px;
      cursor: pointer;
    }
    button:hover { background: var(--hover); }
    #search {
      width: min(360px, 100%);
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--fg);
      border-radius: 7px;
      padding: 7px 10px;
    }
    #status {
      min-height: 1.4em;
      margin: 0 0 8px;
      color: var(--muted);
      font-size: .9rem;
    }
    #status.error { color: var(--danger); }
    .tree, .tree ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .tree ul { margin-left: 28px; }
    details { margin: 2px 0; }
    summary {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 42px;
      padding: 5px 8px;
      border-radius: 7px;
      cursor: pointer;
      user-select: none;
      list-style: none;
    }
    summary::-webkit-details-marker { display: none; }
    summary:hover, .file:hover { background: var(--hover); }
    .chevron {
      width: 10px;
      height: 10px;
      flex: 0 0 auto;
      border-right: 2px solid var(--muted);
      border-bottom: 2px solid var(--muted);
      transform: rotate(-45deg);
      transition: transform .14s ease;
      margin-right: 2px;
    }
    details[open] > summary > .chevron { transform: rotate(45deg); }
    .folder-icon {
      width: 23px;
      height: 16px;
      flex: 0 0 auto;
      background: var(--folder);
      border-radius: 3px;
      position: relative;
    }
    .folder-icon::before {
      content: "";
      position: absolute;
      left: 2px;
      top: -5px;
      width: 10px;
      height: 6px;
      border-radius: 3px 3px 0 0;
      background: var(--folder);
    }
    .file {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 42px;
      margin: 2px 0;
      padding: 5px 8px 5px 31px;
      border-radius: 7px;
      color: inherit;
      text-decoration: none;
    }
    .file-icon {
      width: 18px;
      height: 23px;
      flex: 0 0 auto;
      border: 2px solid var(--file);
      border-radius: 2px;
      position: relative;
    }
    .file-icon::before {
      content: "";
      position: absolute;
      right: -2px;
      top: -2px;
      width: 7px;
      height: 7px;
      background: var(--bg);
      border-left: 2px solid var(--file);
      border-bottom: 2px solid var(--file);
    }
    .name { overflow-wrap: anywhere; }
    .loading {
      margin: 5px 0 5px 31px;
      color: var(--muted);
      font-size: .9rem;
    }
    .hidden-by-search { display: none !important; }
    @media (max-width: 700px) {
      main { padding: 10px; }
      body { font-size: 16px; }
      .tree ul { margin-left: 15px; }
      .toolbar { align-items: stretch; }
      h1 { width: 100%; }
      #search { width: 100%; }
    }
  </style>
</head>
<body>
<main>
  <div class="toolbar">
    <h1 id="title">Documents</h1>
    <input id="search" type="search" placeholder="Rechercher…" aria-label="Rechercher">
    <button id="expandAll" type="button">Tout déplier</button>
    <button id="collapseAll" type="button">Tout replier</button>
  </div>
  <p id="status">Chargement…</p>
  <ul id="tree" class="tree"></ul>
</main>

<script>
/* ============================================================
   CONFIGURATION — À MODIFIER
   ============================================================ */
const GITHUB_USER = "";
const GITHUB_REPO = "";
const BRANCH = "main";
const ROOT_FOLDER = "documents";
/* ============================================================ */

const API_BASE =
  `https://api.github.com/repos/${encodeURIComponent(GITHUB_USER)}/${encodeURIComponent(GITHUB_REPO)}/contents`;

const tree = document.getElementById("tree");
const status = document.getElementById("status");
const title = document.getElementById("title");
const search = document.getElementById("search");

title.textContent = ROOT_FOLDER || GITHUB_REPO;

function apiPath(path) {
  if (!path) return API_BASE;
  return API_BASE + "/" + path.split("/").map(encodeURIComponent).join("/");
}

function siteHref(path) {
  const base = new URL("./", window.location.href);
  const encoded = path.split("/").map(encodeURIComponent).join("/");
  return new URL(encoded, base).href;
}

async function getContents(path) {
  const url = new URL(apiPath(path));

  const response = await fetch(url, {
    headers: { "Accept": "application/vnd.github+json" }
  });

  if (!response.ok) {
    let detail = "";
    try {
      const data = await response.json();
      detail = data.message ? ` — ${data.message}` : "";
    } catch (_) {}

    if (response.status === 403) {
      throw new Error(
        "Accès refusé ou limite de l’API GitHub atteinte. " +
        "L’API publique non authentifiée est limitée en nombre de requêtes." + detail
      );
    }
    if (response.status === 404) {
      throw new Error(
        `Dossier introuvable : "${path || "/"}". Vérifiez GITHUB_USER, GITHUB_REPO, BRANCH et ROOT_FOLDER.` + detail
      );
    }
    throw new Error(`Erreur GitHub ${response.status}${detail}`);
  }

  const data = await response.json();
  if (!Array.isArray(data)) {
    throw new Error(`"${path}" n’est pas un dossier.`);
  }

  return data.sort((a, b) => {
    if (a.type !== b.type) return a.type === "dir" ? -1 : 1;
    return a.name.localeCompare(b.name, "fr", { numeric: true, sensitivity: "base" });
  });
}

function folderRow(item) {
  const li = document.createElement("li");
  li.dataset.name = item.name.toLocaleLowerCase("fr");

  const details = document.createElement("details");
  details.dataset.loaded = "false";
  details.dataset.path = item.path;

  const summary = document.createElement("summary");
  summary.innerHTML =
    `<span class="chevron"></span>` +
    `<span class="folder-icon"></span>` +
    `<span class="name"></span>`;
  summary.querySelector(".name").textContent = item.name;

  const children = document.createElement("ul");
  children.innerHTML = `<li class="loading">Chargement…</li>`;

  details.append(summary, children);
  li.append(details);

  details.addEventListener("toggle", async () => {
    if (!details.open || details.dataset.loaded === "true" || details.dataset.loaded === "loading") return;

    details.dataset.loaded = "loading";
    try {
      const items = await getContents(item.path);
      children.replaceChildren(...items.map(makeRow));
      details.dataset.loaded = "true";
      applySearch();
    } catch (e) {
      children.innerHTML = "";
      const err = document.createElement("li");
      err.className = "loading";
      err.textContent = e.message;
      children.append(err);
      details.dataset.loaded = "false";
    }
  });

  return li;
}

function fileRow(item) {
  const li = document.createElement("li");
  li.dataset.name = item.name.toLocaleLowerCase("fr");

  const a = document.createElement("a");
  a.className = "file";
  a.href = siteHref(item.path);
  a.target = "_blank";
  a.rel = "noopener";
  a.innerHTML = `<span class="file-icon"></span><span class="name"></span>`;
  a.querySelector(".name").textContent = item.name;

  li.append(a);
  return li;
}

function makeRow(item) {
  return item.type === "dir" ? folderRow(item) : fileRow(item);
}

async function loadRoot() {
  status.className = "";
  status.textContent = "Chargement…";

  try {
    const items = await getContents(ROOT_FOLDER);
    tree.replaceChildren(...items.map(makeRow));
    status.textContent = "";
  } catch (e) {
    tree.replaceChildren();
    status.className = "error";
    status.textContent = e.message;
  }
}

async function expandRecursively(details) {
  if (!details.open) details.open = true;

  while (details.dataset.loaded === "loading") {
    await new Promise(r => setTimeout(r, 50));
  }

  if (details.dataset.loaded !== "true") return;

  const nested = [...details.querySelectorAll(":scope > ul > li > details")];
  for (const child of nested) {
    await expandRecursively(child);
  }
}

document.getElementById("expandAll").addEventListener("click", async () => {
  status.className = "";
  status.textContent = "Déploiement de l’arborescence…";
  const roots = [...tree.querySelectorAll(":scope > li > details")];
  for (const d of roots) await expandRecursively(d);
  status.textContent = "";
});

document.getElementById("collapseAll").addEventListener("click", () => {
  [...tree.querySelectorAll("details")].forEach(d => d.open = false);
});

function applySearch() {
  const q = search.value.trim().toLocaleLowerCase("fr");

  if (!q) {
    [...tree.querySelectorAll("li")].forEach(li => li.classList.remove("hidden-by-search"));
    return;
  }

  const all = [...tree.querySelectorAll("li")];
  for (const li of all.reverse()) {
    const ownName = li.dataset.name || "";
    const ownMatch = ownName.includes(q);
    const children = [...li.querySelectorAll(":scope > details > ul > li")];
    const childMatch = children.some(child => !child.classList.contains("hidden-by-search"));

    const keep = ownMatch || childMatch;
    li.classList.toggle("hidden-by-search", !keep);

    const d = li.querySelector(":scope > details");
    if (keep && d && childMatch) d.open = true;
  }
}

search.addEventListener("input", applySearch);

loadRoot();
</script>
</body>
</html>
